<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MARKETA">
  <!-- Drawn as paths rather than set as text: a glyph would depend on a font
       being present, and this has to render inside a 16px browser tab, in a
       Windows taskbar button, and on whatever machine the shop uses. The
       orange is the theme-color already declared in index.html. -->
  <rect width="64" height="64" rx="14" fill="#f97316"/>
  <path d="M24 27 V22 a8 8 0 0 1 16 0 V27" fill="none" stroke="#fff"
        stroke-width="4.5" stroke-linecap="round"/>
  <rect x="15" y="27" width="34" height="25" rx="4.5" fill="#fff"/>
</svg>

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketa
      POSTGRES_USER: marketa
      POSTGRES_PASSWORD: marketa
    ports:
      - "5432:5432"
    volumes:
      - marketa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketa_data:
